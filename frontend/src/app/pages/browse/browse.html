<main class="min-h-screen bg-zinc-950 text-white">

        <!-- Header -->
    <section class="mx-auto max-w-7xl px-8 pt-14">

        <h1 class="mb-3 text-5xl font-black">
            Browse Anime
        </h1>

        <p class="mb-10 text-zinc-400">
            Discover your next favorite series.
        </p>

        <!-- Search -->
        <div class="mb-8">

            <input
                type="text"
                [(ngModel)]="searchQuery"
                (input)="applyFilters()"
                placeholder="Search anime..."
                class="w-full rounded-xl border border-zinc-700
                       bg-zinc-900 px-5 py-4 text-white
                       outline-none focus:border-violet-500"
            >

        </div>

        <div class="filters">

            <div class="search-container">
            
            </div>

            <!-- Sort -->
             <div class="filter">
                <label for="sort">Sort By</label>

                <select 
                    id="sort"
                    [(ngModel)]="selectedSort"
                    (change)="applyFilters()"
                    class="rounded-lg bg-zinc-900 border border-zinc-700 px-4 py-2 text-white">

                    <option value="default">Default</option>
                    <option value="score-desc">Highest Score</option>
                    <option value="score-asc">Lowest Score</option>
                    <option value="title-desc">Title: A-Z</option>
                    <option value="title-asc">Title: Z-A</option>
                    <option value="episodes-desc">Most Episodes</option>
                    <option value="episodes-asc">Fewest Episodes</option>
                
                </select>
             </div>

            <!-- Season -->
            <div class="filter">
                <label for="season">Season</label>

                <select
                    id="season"
                    [(ngModel)]="selectedSeason"
                    (change)="applyFilters()"
                    class="rounded-lg bg-zinc-900 border border-zinc-700 px-4 py-2 text-white">

                    <option value="All">All Seasons</option>
                    <option value="Winter">Winter</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Fall">Fall</option>

                </select>
            </div>

            <!-- Status -->
            <div class="filter">
                <label for="status">Status</label>

                <select
                    id="status"
                    [(ngModel)]="selectedStatus"
                    (change)="applyFilters()"
                    class="rounded-lg bg-zinc-900 border border-zinc-700 px-4 py-2 text-white">

                    <option value="All">All Statuses</option>
                    <option value="Currently Airing">Currently Airing</option>
                    <option value="Finished">Finished</option>
                    <option value="Upcoming">Upcoming</option>

                </select>
            </div>

            <!-- Clear -->
            <button
                type="button"
                (click)="clearFilters()"
                class="rounded-lg bg-zinc-900 border border-zinc-700 px-4 py-2 text-white">

                Clear Filters

            </button>

        </div>

     </section>


    <!-- Anime Grid -->
    <section class="mx-auto max-w-7xl px-8 pb-20">

        <div class="mb-8 flex items-center justify-between">

            <h2 class="text-2xl font-bold">
                Anime
            </h2>

            <p class="text-zinc-500">
                {{ filteredAnimesData.length }} results
            </p>

        </div>

        <div class="grid gap-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5">

            <app-anime-card
                *ngFor="let anime of filteredAnimesData"
                [anime]="anime">
            </app-anime-card>

        </div>

    </section>

</main>
