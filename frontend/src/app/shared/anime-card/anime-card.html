<div class="overflow-hidden rounded-2xl bg-zinc-900 transition hover:-translate-y-2 hover:scale-105">

    <img
        [src]="anime.imageUrl"
        [alt]="anime.title"
        class="aspect-[2/3] w-full object-cover"
    >

    <div class="p-5">
        <h3 class="mb-2 text-lg font-bold text-white">
            {{anime.title}}
        </h3>   

        <p class="text-yellow-400">
            ⭐ {{ anime.score }}
        </p>

        <p class="mt-2 text-sm text-zinc-400">
            {{ anime.episodes }} Episodes     
        </p>

    </div>
</div>
